name: Build panxcz-tool APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Setup Android SDK (compileSdk 36 + NDK r28b)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build native libpanxcz.so
        run: ./build_native.sh

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: panxcz-tool-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign APK
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo "[i] PRIVATE_REPO_TOKEN belum di-set, skip signing."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/${{ github.repository_owner }}/panxcz-keystore.git" \
            /tmp/keystore-clone
          mkdir -p app/keystore
          cp /tmp/keystore-clone/keystore/panxcz-release.jks app/keystore/
          ./gradlew :app:assembleRelease \
            -PsigningEnabled=true \
            -PstorePass="${KEYSTORE_PASSWORD}" \
            -Palias=panxcz_release \
            -PkeyPass="${KEYSTORE_PASSWORD}" \
            --stacktrace --no-daemon
          echo "SIGN_APK=true" >> $GITHUB_ENV

      - name: Upload signed APK
        if: ${{ success() && env.SIGN_APK == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: panxcz-tool-release-signed
          path: app/build/outputs/apk/release/app-release.apk
